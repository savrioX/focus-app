<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger</title>
<link rel="icon" type="image/png" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15171B;
    --surface: #1C1F24;
    --surface-raised: #22262C;
    --hairline: #2C3038;
    --text: #ECEDEF;
    --text-muted: #888E99;
    --text-faint: #565B64;

    --cut: #9B5140;
    --cut-soft: rgba(155, 81, 64, 0.16);
    --protect: #A08A5A;
    --protect-soft: rgba(160, 138, 90, 0.16);
    --grow: #5C7FA0;
    --grow-soft: rgba(92, 127, 160, 0.16);

    --ahead: #7C9A6E;
    --onpace: #C4A35A;
    --behind: #B3654A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 40px 24px 80px;
    min-height: 100vh;
  }

  .page { max-width: 880px; margin: 0 auto; }

  /* Header */
  .back-link {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    margin-bottom: 18px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--text); }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
    gap: 20px;
    flex-wrap: wrap;
  }

  .masthead-title {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 40px;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .masthead-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .week-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .week-nav button {
    background: var(--surface-raised);
    border: 1px solid var(--hairline);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s;
  }
  .week-nav button:hover { border-color: var(--text-muted); }
  .week-nav button:focus-visible { outline: 2px solid var(--grow); outline-offset: 2px; }

  .week-label {
    font-size: 13px;
    color: var(--text-muted);
    min-width: 148px;
    text-align: center;
  }

  hr.divider {
    border: none;
    border-top: 1px solid var(--hairline);
    margin: 24px 0 28px;
  }

  /* Momentum summary strip */
  .momentum {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 20px 24px;
    margin-bottom: 32px;
  }

  .momentum-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .momentum-value {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 34px;
  }

  .momentum-detail {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    text-align: right;
  }

  /* Sections */
  .section { margin-bottom: 30px; }

  .section-tab {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .tab-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .section-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .section-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
  }

  .ledger {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    overflow: hidden;
  }

  .ledger-head {
    display: grid;
    grid-template-columns: 1fr repeat(7, 34px) 64px;
    gap: 4px;
    padding: 12px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .ledger-head span { text-align: center; }
  .ledger-head span:first-child { text-align: left; }
  .ledger-head span:last-child { text-align: right; }

  .habit-row {
    display: grid;
    grid-template-columns: 1fr repeat(7, 34px) 64px;
    gap: 4px;
    align-items: center;
    padding: 13px 18px;
    border-top: 1px solid var(--hairline);
  }

  .habit-name {
    font-size: 14px;
    font-weight: 500;
  }
  .habit-target {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .check {
    width: 24px;
    height: 24px;
    margin: 0 auto;
    border-radius: 6px;
    border: 1px solid var(--hairline);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background .12s, border-color .12s, transform .08s;
  }
  .check:hover { border-color: var(--text-muted); }
  .check:active { transform: scale(0.92); }
  .check:focus-visible { outline: 2px solid var(--grow); outline-offset: 2px; }

  .check.today { border-color: var(--text-muted); }

  .check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .1s; }
  .check.checked svg { opacity: 1; }

  .check.checked.cut { background: var(--cut-soft); border-color: var(--cut); }
  .check.checked.cut svg { stroke: var(--cut); }
  .check.checked.protect { background: var(--protect-soft); border-color: var(--protect); }
  .check.checked.protect svg { stroke: var(--protect); }
  .check.checked.grow { background: var(--grow-soft); border-color: var(--grow); }
  .check.checked.grow svg { stroke: var(--grow); }

  .score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-align: right;
    font-weight: 500;
  }
  .score.ahead { color: var(--ahead); }
  .score.onpace { color: var(--onpace); }
  .score.behind { color: var(--behind); }

  footer {
    margin-top: 28px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.6;
  }

  @media (max-width: 640px) {
    .ledger-head, .habit-row { grid-template-columns: 1fr repeat(7, 26px) 48px; padding-left: 12px; padding-right: 12px; }
    .check { width: 20px; height: 20px; }
    .masthead-title { font-size: 30px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <a href="/" class="back-link">← Compound</a>

  <div class="masthead">
    <div>
      <div class="masthead-title">The Ledger</div>
      <div class="masthead-sub">Cut what costs you · protect what compounds</div>
    </div>
    <div class="week-nav">
      <button id="prevWeek" aria-label="Previous week">←</button>
      <div class="week-label" id="weekLabel"></div>
      <button id="nextWeek" aria-label="Next week">→</button>
    </div>
  </div>

  <hr class="divider">

  <div class="momentum">
    <div>
      <div class="momentum-label">Weekly momentum</div>
      <div class="momentum-value" id="momentumValue">—</div>
    </div>
    <div class="momentum-detail" id="momentumDetail">loading…</div>
  </div>

  <div id="sections"></div>

  <footer id="footerNote"></footer>

</div>

<script>
(function(){
  const DAY_LABELS = ['M','T','W','T','F','S','S'];

  const CATEGORIES = [
    { key:'cut',     title:'Cut',     color:'var(--cut)',     class:'cut',     habits:[] },
    { key:'protect', title:'Protect', color:'var(--protect)', class:'protect', habits:[] },
    { key:'grow',    title:'Grow',    color:'var(--grow)',    class:'grow',    habits:[] },
  ];

  function mondayOf(d){
    const date = new Date(d);
    const day = date.getDay();
    date.setDate(date.getDate() + (day === 0 ? -6 : 1) - day);
    date.setHours(0,0,0,0);
    return date;
  }
  function fmt(d){ return d.toISOString().slice(0,10); }
  function addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; }
  function weekKey(monday){ return 'ledger-week:' + fmt(monday); }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  let currentMonday = mondayOf(new Date());
  const todayStr    = fmt(new Date());
  let weekData      = {};
  let customTargets = {};  // { habitId: number } — overrides default targets
  let customHabits  = {};  // { catKey: [{id, name, target, note}] } — user-added

  const sectionsEl       = document.getElementById('sections');
  const weekLabelEl      = document.getElementById('weekLabel');
  const momentumValueEl  = document.getElementById('momentumValue');
  const momentumDetailEl = document.getElementById('momentumDetail');
  const footerNote       = document.getElementById('footerNote');

  function checkIcon(){
    return '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5L6.2 12 13 4"/></svg>';
  }

  // Returns merged base + custom habits for a category, with custom targets applied
  function habitsFor(catKey){
    const base   = CATEGORIES.find(c => c.key === catKey).habits;
    const custom = customHabits[catKey] || [];
    return [...base, ...custom].map(h => ({
      ...h,
      target: customTargets[h.id] !== undefined ? customTargets[h.id] : h.target,
    }));
  }

  function render(){
    const sunday = addDays(currentMonday, 6);
    const opts = { month:'short', day:'numeric' };
    weekLabelEl.textContent = currentMonday.toLocaleDateString('en-US', opts) + ' – ' + sunday.toLocaleDateString('en-US', opts);

    sectionsEl.innerHTML = '';
    let totalPct = 0, habitCount = 0;

    CATEGORIES.forEach(cat => {
      const habits = habitsFor(cat.key);
      const section = document.createElement('div');
      section.className = 'section';

      const tab = document.createElement('div');
      tab.className = 'section-tab';
      tab.innerHTML = `<span class="tab-dot" style="background:${cat.color}"></span>
        <span class="section-title">${cat.title}</span>
        <span class="section-count">${habits.length} habit${habits.length !== 1 ? 's' : ''}</span>`;
      section.appendChild(tab);

      if (habits.length) {
      const ledger = document.createElement('div');
      ledger.className = 'ledger';

      const head = document.createElement('div');
      head.className = 'ledger-head';
      head.innerHTML = '<span></span>' + DAY_LABELS.map(d=>`<span>${d}</span>`).join('') + '<span>score</span>';
      ledger.appendChild(head);

      habits.forEach(h => {
        const row = document.createElement('div');
        row.className = 'habit-row';

        // Name + editable frequency
        const nameCell = document.createElement('div');
        nameCell.innerHTML = `<div class="habit-name">${esc(h.name)}</div>`;
        const tgtWrap = document.createElement('div');
        tgtWrap.style.cssText = 'font-size:10px;color:var(--text-faint);margin-top:3px;display:flex;align-items:center;gap:4px;font-family:\'IBM Plex Mono\',monospace;';
        const tgtInput = document.createElement('input');
        tgtInput.type = 'number'; tgtInput.min = 1; tgtInput.max = 7; tgtInput.value = h.target;
        tgtInput.style.cssText = 'width:26px;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:4px;color:var(--text);font-size:10px;text-align:center;padding:1px 2px;font-family:inherit;';
        tgtInput.setAttribute('aria-label', 'Weekly target for ' + h.name);
        tgtInput.addEventListener('change', () => {
          const v = Math.max(1, Math.min(7, parseInt(tgtInput.value) || h.target));
          tgtInput.value = v;
          customTargets[h.id] = v;
          saveCustomTargets();
          render();
        });
        tgtWrap.appendChild(document.createTextNode('target: '));
        tgtWrap.appendChild(tgtInput);
        tgtWrap.appendChild(document.createTextNode('/wk'));
        nameCell.appendChild(tgtWrap);
        row.appendChild(nameCell);

        // Day checkboxes
        const checks = (weekData[h.id] && weekData[h.id].length === 7)
          ? weekData[h.id]
          : [false,false,false,false,false,false,false];
        weekData[h.id] = checks;

        for (let i = 0; i < 7; i++){
          const dayDate = fmt(addDays(currentMonday, i));
          const btn = document.createElement('button');
          btn.className = 'check ' + cat.class + (checks[i] ? ' checked' : '') + (dayDate === todayStr ? ' today' : '');
          btn.innerHTML = checkIcon();
          btn.setAttribute('aria-label', h.name + ' — ' + dayDate);
          btn.addEventListener('click', () => toggle(h.id, i));
          row.appendChild(btn);
        }

        // Score
        const count = checks.filter(Boolean).length;
        const pct   = Math.round((count / h.target) * 100);
        totalPct   += Math.min(pct, 100);
        habitCount++;
        const status = pct >= 100 ? 'ahead' : pct >= 50 ? 'onpace' : 'behind';
        const scoreCell = document.createElement('div');
        scoreCell.className = 'score ' + status;
        scoreCell.textContent = count + '/' + h.target;
        row.appendChild(scoreCell);

        ledger.appendChild(row);
      });

      section.appendChild(ledger);
      } // end if habits.length

      // Add habit row
      const addRow = document.createElement('div');
      addRow.style.cssText = 'padding:10px 18px 18px;';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+ Add habit';
      addBtn.style.cssText = 'background:none;border:1px dashed var(--hairline);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;width:100%;text-align:left;letter-spacing:0.02em;transition:border-color .15s,color .15s;';
      addBtn.addEventListener('mouseover', () => { addBtn.style.borderColor='var(--text-muted)'; addBtn.style.color='var(--text)'; });
      addBtn.addEventListener('mouseout',  () => { addBtn.style.borderColor='var(--hairline)';   addBtn.style.color='var(--text-muted)'; });

      const addForm = document.createElement('div');
      addForm.style.cssText = 'display:none;gap:8px;align-items:center;';
      const nameInp = document.createElement('input');
      nameInp.type = 'text'; nameInp.placeholder = 'Habit name…';
      nameInp.style.cssText = 'flex:1;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;min-width:0;';
      const freqInp = document.createElement('input');
      freqInp.type = 'number'; freqInp.min = 1; freqInp.max = 7; freqInp.value = 7; freqInp.placeholder = '7';
      freqInp.style.cssText = 'width:44px;background:var(--surface-raised);border:1px solid var(--hairline);border-radius:8px;padding:7px 6px;font-size:13px;color:var(--text);font-family:inherit;outline:none;text-align:center;';
      freqInp.title = 'Days per week';
      const freqLabel = document.createElement('span');
      freqLabel.textContent = '/wk';
      freqLabel.style.cssText = 'font-size:11px;color:var(--text-faint);font-family:\'IBM Plex Mono\',monospace;white-space:nowrap;';
      const addSubmit = document.createElement('button');
      addSubmit.textContent = 'Add';
      addSubmit.style.cssText = `background:${cat.color};border:none;border-radius:8px;padding:7px 16px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;opacity:0.9;`;
      const addCancel = document.createElement('button');
      addCancel.textContent = '✕';
      addCancel.style.cssText = 'background:none;border:1px solid var(--hairline);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;';

      addForm.appendChild(nameInp); addForm.appendChild(freqInp); addForm.appendChild(freqLabel);
      addForm.appendChild(addSubmit); addForm.appendChild(addCancel);

      addBtn.addEventListener('click', () => { addBtn.style.display='none'; addForm.style.display='flex'; nameInp.focus(); });
      addCancel.addEventListener('click', () => { addBtn.style.display=''; addForm.style.display='none'; nameInp.value=''; freqInp.value=7; });

      const doAdd = () => {
        const name = nameInp.value.trim();
        const freq = Math.max(1, Math.min(7, parseInt(freqInp.value) || 7));
        if (!name) return;
        addCustomHabit(cat.key, name, freq);
        addCancel.click();
      };
      addSubmit.addEventListener('click', doAdd);
      nameInp.addEventListener('keydown', e => { if(e.key==='Enter') doAdd(); if(e.key==='Escape') addCancel.click(); });

      addRow.appendChild(addBtn); addRow.appendChild(addForm);
      section.appendChild(addRow);
      sectionsEl.appendChild(section);
    });

    const avgPct = habitCount ? Math.round(totalPct / habitCount) : 0;
    momentumValueEl.textContent = avgPct + '%';
    momentumValueEl.style.color = avgPct >= 100 ? 'var(--ahead)' : avgPct >= 50 ? 'var(--onpace)' : 'var(--behind)';
    momentumDetailEl.textContent = fmt(mondayOf(new Date())) === fmt(currentMonday) ? 'this week, live' : 'archived week';
    footerNote.textContent = 'Tap a box to log · edit the number to change frequency · + to add a habit';
  }

  // ── Persistence ──────────────────────────────────────────────────────────

  async function loadWeek(){
    const key = weekKey(currentMonday);
    try {
      const result = await window.storage.get(key, false);
      weekData = result && result.value ? JSON.parse(result.value) : {};
    } catch(e) { weekData = {}; }
  }

  async function saveWeek(){
    try {
      await window.storage.set(weekKey(currentMonday), JSON.stringify(weekData), false);
    } catch(e) { console.error('Storage error', e); }
  }

  async function loadCustomTargets(){
    try {
      const r = await window.storage.get('ledger-targets', false);
      customTargets = r && r.value ? JSON.parse(r.value) : {};
    } catch(e) { customTargets = {}; }
  }

  async function saveCustomTargets(){
    try {
      await window.storage.set('ledger-targets', JSON.stringify(customTargets), false);
    } catch(e) {}
  }

  async function loadCustomHabits(){
    try {
      const r = await window.storage.get('ledger-custom', false);
      customHabits = r && r.value ? JSON.parse(r.value) : {};
    } catch(e) { customHabits = {}; }
  }

  async function saveCustomHabits(){
    try {
      await window.storage.set('ledger-custom', JSON.stringify(customHabits), false);
    } catch(e) {}
  }

  // ── Actions ──────────────────────────────────────────────────────────────

  function toggle(habitId, dayIndex){
    if (!weekData[habitId] || weekData[habitId].length !== 7)
      weekData[habitId] = [false,false,false,false,false,false,false];
    weekData[habitId][dayIndex] = !weekData[habitId][dayIndex];
    render();
    saveWeek();
  }

  function addCustomHabit(catKey, name, freq){
    const id = catKey + '-' + Date.now();
    if (!customHabits[catKey]) customHabits[catKey] = [];
    customHabits[catKey].push({ id, name, target: freq, note: freq + 'x / wk' });
    saveCustomHabits();
    render();
  }

  // ── Nav ──────────────────────────────────────────────────────────────────

  document.getElementById('prevWeek').addEventListener('click', async () => {
    currentMonday = addDays(currentMonday, -7);
    await loadWeek();
    render();
  });
  document.getElementById('nextWeek').addEventListener('click', async () => {
    currentMonday = addDays(currentMonday, 7);
    await loadWeek();
    render();
  });

  // ── Init ─────────────────────────────────────────────────────────────────

  async function init(){
    await Promise.all([loadWeek(), loadCustomTargets(), loadCustomHabits()]);
    render();
  }
  init();
})();
</script>
</body>
</html>
